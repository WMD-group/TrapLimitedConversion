[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "TrapLimitedConversion"
dynamic = ["version"]
description = "Computing solar energy conversion limits using the Trap Limited Conversion (TLC) metric"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.6",
    "matplotlib>=3.3",
    "pandas>=1.3",
]

[project.optional-dependencies]
doped = ["doped>=2.0"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tlc*"]

[tool.setuptools.package-data]
tlc = ["../data/ASTMG173.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
